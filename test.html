<!DOCTYPE html>
<html>

<head>
    <title>Scientific Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .button button {
            width: 24%;
            height: 50px;
            border-radius: 5px;
            margin-bottom: 5px;
        }

        .input input {
            height: 50px;
            width: 100%;
        }

        .calculator {
            position: absolute;
            width: 400px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px;
            border-radius: 10px;
        }
        .scientificButton button{
            width: 24%;
            height: 50px;
            border-radius: 5px;
            margin-bottom: 5px;
        }
        .scientificButton{
            display: none;
            
        }
    </style>
</head>

<body>
    <div class="container1 bg-dark">
        <div class="calculator" style="background-color: rgb(153, 151, 151);">
            <div class="input mb-3">
                <input type="text" id="display" readonly placeholder="0">
            </div>
            <div class="button">
                <button id="clear" class="btn btn-secondary">clear</button>
                <button id="delete" class="btn btn-secondary">delete</button>
                <button class="btn btn-secondary operator" data-operator="%">%</button>
                <button class="btn btn-secondary operator" data-operator="/">/</button><br>

                <button class="btn btn-light number">1</button>
                <button class="btn btn-light number">2</button>
                <button class="btn btn-light number">3</button>
                <button class="btn btn-secondary operator" data-operator="+">+</button><br>

                <button class="btn btn-light number">4</button>
                <button class="btn btn-light number">5</button>
                <button class="btn btn-light number">6</button>
                <button class="btn btn-secondary operator" data-operator="-">-</button><br>

                <button class="btn btn-light number">7</button>
                <button class="btn btn-light number">8</button>
                <button class="btn btn-light number">9</button>
                <button class="btn btn-secondary number">.</button><br>

                <button class="btn btn-light number">0</button>
                <button id="equal" class="btn btn-light equal">=</button>
                <button class="btn btn-warning" id="mode1">mode2</button>
                <button class="btn btn-secondary operator" data-operator="*">x</button>
            </div>
            <div class="scientificButton" id="scientificButton">
                <button class="btn btn-info operator" data-operator="sin">sin</button>
                <button class="btn btn-info operator" data-operator="cos">cos</button>
                <button class="btn btn-info operator" data-operator="tan">tan</button>
                <button class="btn btn-info operator" data-operator="sin-1">sin <sup>-1</sup></button>
                <button class="btn btn-info operator" data-operator="cos-1">cos <sup>-1</sup></button>
                <button class="btn btn-info operator" data-operator="tan-1">tan <sup>-1</sup></button>
                <button class="btn btn-info operator" data-operator="π">π</button>
                <button class="btn btn-info operator" data-operator="e">e</button>
                <button class="btn btn-info operator" data-operator="x2">x <sup>2</sup></button>
                <button class="btn btn-info operator" data-operator="xy">x <sup>y</sup></button>
                <button class="btn btn-info operator" data-operator="√x">√x</button>
                <button class="btn btn-info operator" data-operator="3√x">3√x</button>
                <button class="btn btn-info operator" data-operator="y√x">y√x</button>
                <button class="btn btn-info operator" data-operator="10x">10 <sup>x</sup></button>
                <button class="btn btn-info operator" data-operator="(">(</button>
                <button class="btn btn-info operator" data-operator=")">)</button>
                <button class="btn btn-info operator" data-operator="1/x">1/x</button>
                <button class="btn btn-info operator" data-operator="n!">n!</button>
                <button class="btn btn-info operator" data-operator="log">log</button>
                <button class="btn btn-info operator" data-operator="ln">ln</button>
                <button class="btn btn-primary" id="degRadBtn">DEG</button>
                <button class="btn btn-warning" id="mode2">mode1</button>
            </div>
        </div>
    </div>

  <script>
    const numbtn = document.querySelectorAll('.number');
    const opbtns = document.querySelectorAll('.operator');
    const display = document.getElementById('display');
    const dltbtn = document.getElementById('delete');
    const clrbtn = document.getElementById('clear');
    const equal = document.getElementById('equal');
    const degRadBtn = document.getElementById('degRadBtn');
    let isDegreeMode = true; // Tracks the current mode

    let issecond = false;
    let num1 = '';
    let num2 = '';
    let operator = '';
    
    // --- NEW: The Memory Stack for Parentheses ---
    let stack = []; 

    const prefixOps = ['sin', 'cos', 'tan', 'sin-1', 'cos-1', 'tan-1', '√x', '3√x', '10x', 'log', 'ln']; 

    function gamma(z) {
        const g = 7;
        const C = [
            0.99999999999980993, 676.5203681218851, -1259.1392167224028,
            771.32342877765313, -176.61502916214059, 12.507343278686905,
            -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7
        ];
        if (z < 0.5) return Math.PI / (Math.sin(Math.PI * z) * gamma(1 - z));
        z -= 1;
        let x = C[0];
        for (let i = 1; i < g + 2; i++) x += C[i] / (z + i);
        let t = z + g + 0.5;
        return Math.sqrt(2 * Math.PI) * Math.pow(t, z + 0.5) * Math.exp(-t) * x;
    }

    function factorial(n) {
        if (n < 0 && Number.isInteger(n)) return NaN; 
        if (Number.isInteger(n)) {
            if (n === 0 || n === 1) return 1;
            let res = 1;
            for (let i = 2; i <= n; i++) res *= i;
            return res;
        }
        return gamma(n + 1);
    }

    function evaluateScientific(op, val1, val2) {
        const number1 = parseFloat(val1);
        const number2 = parseFloat(val2);

        switch (op) {     
            case "sin":
                if (isDegreeMode) {
                    if (Math.abs(number1) % 180 === 0) return 0; // Fixes Pi rounding error
                    return Math.sin(number1 * (Math.PI / 180));
                }
                return Math.sin(number1);
                
            case "cos":
                if (isDegreeMode) {
                    if ((Math.abs(number1) - 90) % 180 === 0) return 0;
                    return Math.cos(number1 * (Math.PI / 180));
                }
                return Math.cos(number1);
                
            case "tan":
                if (isDegreeMode) {
                    if ((Math.abs(number1) - 90) % 180 === 0) return "Error";
                    if (Math.abs(number1) % 180 === 0) return 0;
                    return Math.tan(number1 * (Math.PI / 180));
                }
                return Math.tan(number1);
                
            case "sin-1":
                return isDegreeMode ? Math.asin(number1) * (180 / Math.PI) : Math.asin(number1);
            case "cos-1":
                return isDegreeMode ? Math.acos(number1) * (180 / Math.PI) : Math.acos(number1);
            case "tan-1":
                return isDegreeMode ? Math.atan(number1) * (180 / Math.PI) : Math.atan(number1);
            case "π": return Math.PI;
            case "e": return Math.E;
            case "x2": return Math.pow(number1, 2);
            case "xy": return Math.pow(number1, number2);
            case "√x": return (number1 < 0) ? Math.sqrt(Math.abs(number1)) + "i" : Math.sqrt(number1);
            case "3√x": return Math.cbrt(number1);
            case "y√x": return Math.pow(number1, 1 / number2); 
            case "10x": return Math.pow(10, number1);
            case "1/x": return number1 !== 0 ? 1 / number1 : "Error";
            case "n!": return factorial(number1);
            case "log":
                if (number1 < 0) return Math.log10(Math.abs(number1)) + " + " + (Math.PI / Math.LN10).toFixed(3) + "i";
                return Math.log10(number1);
            case "ln":
                if (number1 < 0) return Math.log(Math.abs(number1)).toFixed(3) + " + " + Math.PI.toFixed(3) + "i";
                return Math.log(number1);
            default: return null;
        }
    }

    numbtn.forEach(function (numbutton) {
        numbutton.addEventListener('click', function () {
            if (prefixOps.includes(operator)) { 
                num1 += numbutton.textContent;
                display.value = operator + "(" + num1 + ")";
            } else if (issecond) {    
                num2 += numbutton.textContent;
                display.value = num2;
            } else {     
                num1 += numbutton.textContent;
                display.value = num1;
            }
        });
    });

    opbtns.forEach(function (opbutton) {
        opbutton.addEventListener('click', function () {
            const op = opbutton.dataset.operator;

            if (op === "π" || op === "e") {
                const constVal = evaluateScientific(op, 0, 0).toString();
                if (issecond) {
                    num2 = constVal; display.value = num2;
                } else {
                    num1 = constVal; display.value = num1;
                }
                return;
            }

            if (prefixOps.includes(op)) { 
                operator = op;
                num1 = ''; 
                display.value = op + "(";
                return;
            }

            // --- THE NEW PARENTHESES LOGIC ---
            if (op === "(") {
                // 1. Save the current state to the stack
                stack.push({ num1, num2, operator, issecond });
                // 2. Wipe the slate clean for the inside of the parenthesis
                num1 = ''; num2 = ''; operator = ''; issecond = false;
                display.value = "(";
                return;
            }

            if (op === ")") {
                if (stack.length === 0) return; // Ignore if there is no opening parenthesis

                // 1. Calculate whatever is inside the parenthesis right now
                if (operator !== '') {
                    equal.click(); 
                }
                
                let innerResult = num1; // The equal button puts the final answer in num1

                // 2. Pull the paused state out of the stack
                let prevState = stack.pop();
                
                // 3. Drop the new answer into the paused state
                if (prevState.issecond) {
                    num1 = prevState.num1;
                    operator = prevState.operator;
                    num2 = innerResult;
                    issecond = true;
                    display.value = num2;
                } else {
                    num1 = innerResult;
                    issecond = prevState.issecond;
                    operator = prevState.operator;
                    display.value = num1;
                }
                return;
            }
           

            if (op === "-") {
                if (num1 === '') { 
                    num1 = "-";
                    display.value = prefixOps.includes(operator) ? operator + "(" + num1 + ")" : num1;
                    return;
                } else if (issecond && num2 === '') { 
                    num2 = "-";
                    display.value = num2;
                    return;
                }
            }

            
            // If the user presses an operator (+, -, *, /) but both num1 AND num2 already have numbers,
            // we must calculate the existing math before starting the new operation.
            if (num1 !== '' && num2 !== '' && operator !== '' && op !== '(' && op !== ')') {
                equal.click(); // Force the calculator to solve the current equation
            }
           

            // Modified to prevent triggering operator state if only a minus sign is typed
            if (num1 === '' || num1 === '-') return;
            
            operator = op;
            issecond = true;
        });
    });

    degRadBtn.addEventListener('click', function() {
    isDegreeMode = !isDegreeMode; // Swap the mode
    degRadBtn.textContent = isDegreeMode ? "DEG" : "RAD"; // Update the button text
    });

    equal.addEventListener('click', function () {
        const number1 = parseFloat(num1);
        const number2 = parseFloat(num2);
        let result;

        if (isNaN(number1)) return;

        const sciResult = evaluateScientific(operator, num1, num2);

        if (sciResult !== null) { 
            result = sciResult;
        } else {   
            switch (operator) {
                case "+": result = number1 + number2; break;
                case "-": result = number1 - number2; break;
                case "*": result = number1 * number2; break;
                case "/": result = (number2 !== 0) ? number1 / number2 : "Cannot Divide"; break;
                case "%": result = (number1 * number2) / 100; break;
                default: result = number1;
            }
        }
        
        if (typeof result === 'number') {
            result = parseFloat(result.toFixed(10));
        }

        display.value = result;
        num1 = result.toString();
        num2 = "";
        operator = "";
        issecond = false;
    });

    clrbtn.addEventListener("click", function () { 
        num1 = "";
        num2 = "";
        operator = "";
        issecond = false;
        stack = []; // Empties the memory stack
        display.value = "";
    });

    dltbtn.addEventListener("click", function () { 
        if (prefixOps.includes(operator) && num1 !== '') { 
            num1 = num1.slice(0, -1);
            display.value = operator + "(" + num1 + ")";
        } else if (issecond) { 
            num2 = num2.slice(0, -1);
            display.value = num2;
        } else {  
            num1 = num1.slice(0, -1);
            display.value = num1;
        }
    });

    document.getElementById('mode1').addEventListener('click', function () {
        document.getElementById('scientificButton').style.display = 'block';
    });

    document.getElementById('mode2').addEventListener('click', function () {
        document.getElementById('scientificButton').style.display = 'none'; 
    });
</script>
</body>

</html>
