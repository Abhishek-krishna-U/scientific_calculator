<!DOCTYPE html>
<html>

<head>
    <title>
        calculator word
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<style>
    
    
    .button button{
        width: 24%;
        height: 50px;
        
        border-radius: 5px;
    }
    .input input{
        height: 50px;
        width: 100%;
    }
    .calculator {
    position: absolute;
    width: 400px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}




</style>
<body>
    <div class="container1 bg-dark">
    <div class="calculator" style="background-color: rgb(153, 151, 151);">
        <div class="input">
            <input type="text" id="display" readonly placeholder="0">

        </div>
        <div class="button">
            <button onclick="clears()" class="btn btn-secondary">clear</button>
            <button onclick="delet()" class="btn btn-secondary">delete</button>
            <button onclick="appendoperator('%')" class="btn btn-secondary">%</button>
            <button onclick="appendoperator('/')" class="btn btn-secondary">/</button><br>
            <button onclick="appendvalue('1')" class="btn btn-light">1</button>
            <button onclick="appendvalue('2')" class="btn btn-light">2</button>
            <button onclick="appendvalue('3')" class="btn btn-light">3</button>
            <button onclick="appendoperator('+')" class="btn btn-secondary">+</button><br>
            <button onclick="appendvalue('4')" class="btn btn-light">4</button>
            <button onclick="appendvalue('5')" class="btn btn-light">5</button>

            <button onclick="appendvalue('6')" class="btn btn-light">6</button>
            <button onclick="appendoperator('-')"class="btn btn-secondary" >-</button><br>
            <button onclick="appendvalue('7')" class="btn btn-light">7</button>

            <button onclick="appendvalue('8')" class="btn btn-light">8</button>
            <button onclick="appendvalue('9')" class="btn btn-light">9</button>
            <button onclick="appendvalue('.')" class="btn btn-secondary">.</button><br>
                        <button onclick="appendvalue('0')" class="btn btn-light">0</button>

            
            <button onclick="result()" style="width: 49%;" class="btn btn-light">=</button>
            <button onclick="appendoperator('*')" class="btn btn-secondary">x</button>


        </div>

    </div>
    </div>
    <script>
        let display = document.getElementById("display");
        let operator='';
        let num1=''; 
        let num2='';
        let resul = '';
        function appendvalue(value){
            if ((!isNaN(value) || value === ".")&&(operator=='')) {
                num1+= value;
            display.value = num1;
            
            } 
            
            else{
                
                num2+=value;
                display.value=num2;
                


            }
        }

        function appendoperator(operatorvalue){
            display.value = '';
            operator=operatorvalue;
        }
        function result(result){
            switch(operator){
                case '+' :
                    
                    resul = Number(num1) + Number(num2);
                break;
                case '-':
                    
                    resul= Number(num1)- Number(num2);
                break;
                case '/':
                    
                    if(Number(num2)==0){
                    alert("not acceptable");
                    return;
                    }
                     resul = Number(num1) / Number(num2);
                break;
                case '%':
                    
                     resul = Number(num1) % Number(num2);
                break;
                case '*':
                    
                    
                     resul = Number(num1) * Number(num2);
                     break;
                
            }
            display.value=resul;
            num1=resul.toString();
            num2='';
            operator='';

        }
        function clears(){
            display.value='';
            num1='';
            num2='';

            

        }
        function delet(){
        if (operator === '') {
                num1 = num1.slice(0, -1);
                display.value = num1;
            } else {
                num2 = num2.slice(0, -1);
                display.value = num2;
            }       
         }
    </script>
</body>


</html>
