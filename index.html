<!DOCTYPE html>
<html>

<head>
    <title>Scientific Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .button button {
            width: 24%;
            height: 50px;
            border-radius: 5px;
            margin-bottom: 5px;
        }

        .input input {
            height: 50px;
            width: 100%;
        }

        .calculator {
            position: absolute;
            width: 400px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px;
            border-radius: 10px;
        }
        .scientificButton button{
            width: 24%;
            height: 50px;
            border-radius: 5px;
            margin-bottom: 5px;
        }
        .scientificButton{
            display: none;
            
        }
    </style>
</head>

<body>
    <div class="container1 bg-dark">
        <div class="calculator" style="background-color: rgb(153, 151, 151);">
            <div class="input mb-3">
                <input type="text" id="display" readonly placeholder="0">
            </div>
            <div class="button">
                <button id="clear" class="btn btn-secondary">clear</button>
                <button id="delete" class="btn btn-secondary">delete</button>
                <button class="btn btn-secondary operator" data-operator="%">%</button>
                <button class="btn btn-secondary operator" data-operator="/">/</button><br>

                <button class="btn btn-light number">1</button>
                <button class="btn btn-light number">2</button>
                <button class="btn btn-light number">3</button>
                <button class="btn btn-secondary operator" data-operator="+">+</button><br>

                <button class="btn btn-light number">4</button>
                <button class="btn btn-light number">5</button>
                <button class="btn btn-light number">6</button>
                <button class="btn btn-secondary operator" data-operator="-">-</button><br>

                <button class="btn btn-light number">7</button>
                <button class="btn btn-light number">8</button>
                <button class="btn btn-light number">9</button>
                <button class="btn btn-secondary number">.</button><br>

                <button class="btn btn-light number">0</button>
                <button id="equal" class="btn btn-light equal">=</button>
                <button class="btn btn-warning" id="mode1">mode2</button>
                <button class="btn btn-secondary operator" data-operator="*">x</button>
            </div>
            <div class="scientificButton" id="scientificButton">
                <button class="btn btn-info operator" data-operator="sin">sin</button>
                <button class="btn btn-info operator" data-operator="cos">cos</button>
                <button class="btn btn-info operator" data-operator="tan">tan</button>
                <button class="btn btn-info operator" data-operator="sin-1">sin <sup>-1</sup></button>
                <button class="btn btn-info operator" data-operator="cos-1">cos <sup>-1</sup></button>
                <button class="btn btn-info operator" data-operator="tan-1">tan <sup>-1</sup></button>
                <button class="btn btn-info operator" data-operator="π">π</button>
                <button class="btn btn-info operator" data-operator="e">e</button>
                <button class="btn btn-info operator" data-operator="x2">x <sup>2</sup></button>
                <button class="btn btn-info operator" data-operator="xy">x <sup>y</sup></button>
                <button class="btn btn-info operator" data-operator="√x">√x</button>
                <button class="btn btn-info operator" data-operator="3√x">3√x</button>
                <button class="btn btn-info operator" data-operator="y√x">y√x</button>
                <button class="btn btn-info operator" data-operator="10x">10 <sup>x</sup></button>
                <button class="btn btn-info operator" data-operator="(">(</button>
                <button class="btn btn-info operator" data-operator=")">)</button>
                <button class="btn btn-info operator" data-operator="1/x">1/x</button>
                <button class="btn btn-info operator" data-operator="n!">n!</button>
                <button class="btn btn-info operator" data-operator="log">log</button>
                <button class="btn btn-info operator" data-operator="ln">ln</button>
                <button class="btn btn-warning" id="mode2">mode1</button>
            </div>
        </div>
    </div>

   <script>
    const numbtn = document.querySelectorAll('.number');
    const opbtns = document.querySelectorAll('.operator');
    const display = document.getElementById('display');
    const dltbtn = document.getElementById('delete');
    const clrbtn = document.getElementById('clear');
    const equal = document.getElementById('equal');

    let issecond = false;
    let num1 = '';
    let num2 = '';
    let operator = '';

    const prefixOps = ['sin', 'cos', 'tan', 'sin-1', 'cos-1', 'tan-1', '√x', '3√x', '10x', 'log', 'ln']; //operators to be prefixed altered in normal calculator functianality

    function factorial(n) {   //finding factoriol of numbers
        if (n < 0) return NaN;
        if (n === 0 || n === 1) return 1;
        let res = 1;
        for (let i = 2; i <= n; i++) res *= i;
        return res;
    }

    function evaluateScientific(op, val1, val2) {
        const number1 = parseFloat(val1);
        const number2 = parseFloat(val2);

        switch (op) {     // the scientific switch condition 
            case "sin":
                return Math.sin(number1 * (Math.PI / 180));
            case "cos":
                return Math.cos(number1 * (Math.PI / 180));
            case "tan":
                return Math.tan(number1 * (Math.PI / 180));
            case "sin-1":
                return Math.asin(number1) * (180 / Math.PI);
            case "cos-1":
                return Math.acos(number1) * (180 / Math.PI);
            case "tan-1":
                return Math.atan(number1) * (180 / Math.PI);
            case "π":
                return Math.PI;
            case "e":
                return Math.E;
            case "x2":
                return Math.pow(number1, 2);
            case "xy":
                return Math.pow(number1, number2);
            case "√x":
                return Math.sqrt(number1);
            case "3√x":
                return Math.cbrt(number1);
            case "y√x":
                return Math.pow(number1, 1 / number2);
            case "10x":
                return Math.pow(10, number1);
            case "1/x":
                return number1 !== 0 ? 1 / number1 : "Error";
            case "n!":
                return factorial(number1);
            case "log":
                return Math.log10(number1);
            case "ln":
                return Math.log(number1);
            default:
                return null;
        }
    }

    numbtn.forEach(function (numbutton) {
        numbutton.addEventListener('click', function () {
            if (prefixOps.includes(operator)) { // if the operator included in prefix list show the operator with the number
                num1 += numbutton.textContent;
                display.value = operator + "(" + num1 + ")";
            } else if (issecond) {    //if the entry is second number store to second  number variable 
                num2 += numbutton.textContent;
                display.value = num2;
            } else {     // otw store to the first number variable 
                num1 += numbutton.textContent;
                display.value = num1;
            }
        });
    });

    opbtns.forEach(function (opbutton) {
        opbutton.addEventListener('click', function () {
            const op = opbutton.dataset.operator;

            // Direct constants
            if (op === "π" || op === "e") {
                const constVal = evaluateScientific(op, 0, 0).toString();
                if (issecond) { // if its a scientific operation calculate and display the result
                    num2 = constVal;
                    display.value = num2;
                } else { // no operation is acrd just show the value of the constants 
                    num1 = constVal;
                    display.value = num1;
                }
                return;
            }

            // Operator selected FIRST
            if (prefixOps.includes(op)) { // if the selected operator is a prefeixop desplay and store the operator first then take the value for first number and store it
                operator = op;
                num1 = ''; 
                display.value = op + "(";
                return;
            }

            if (num1 === '') return;
            operator = op;
            issecond = true;
        });
    });

    equal.addEventListener('click', function () {// actives wn clicking eql btn
        const number1 = parseFloat(num1);
        const number2 = parseFloat(num2);
        let result;

        if (isNaN(number1)) return;

        //  searches if the operation is scientific switch case
        const sciResult = evaluateScientific(operator, num1, num2);

        if (sciResult !== null) { // if it is then return the result from scientific switch
            result = sciResult;
        } else {   // else perform normal operation
            
            switch (operator) {//normal calculator switch case 
                case "+":
                    result = number1 + number2;
                    break;
                case "-":
                    result = number1 - number2;
                    break;
                case "*":
                    result = number1 * number2;
                    break;
                case "/":
                    result = (number2 !== 0) ? number1 / number2 : "Cannot Divide";
                    break;
                case "%":
                    result = (number1 * number2) / 100;
                    break;
                default:
                    result = number1;
            }
        }

        display.value = result;
        num1 = result.toString();
        num2 = "";
        operator = "";
        issecond = false;
    });

    clrbtn.addEventListener("click", function () {
        num1 = "";
        num2 = "";
        operator = "";
        issecond = false;
        display.value = "";
    });

    dltbtn.addEventListener("click", function () {
        if (prefixOps.includes(operator) && num1 !== '') { // if it is scientific op
            num1 = num1.slice(0, -1);
            display.value = operator + "(" + num1 + ")";
        } else if (issecond) { // if the displayed number is second 
            num2 = num2.slice(0, -1);
            display.value = num2;
        } else {  //if the displayed number is first one 
            num1 = num1.slice(0, -1);
            display.value = num1;
        }
    });

    const mode1 = document.getElementById('mode1'); //show the scientific part
    mode1.addEventListener('click', function () {
        document.getElementById('scientificButton').style.display = 'block';
    });

    const mode2 = document.getElementById('mode2');
    mode2.addEventListener('click', function () {
        document.getElementById('scientificButton').style.display = 'none'; // hide the sctfc part
    });
</script>
</body>

</html>
